name: Desktop validation and distributions

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# A new PR revision supersedes its old validation. Main/tag runs retain their
# source-specific packaging locks and are never cancelled by a PR update.
concurrency:
  group: desktop-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Validate ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            native-path: artifacts/native-dx12
          - os: ubuntu-24.04
            rid: linux-x64
            native-path: artifacts/native-vulkan/linux-x64
          - os: macos-15-intel
            rid: osx-x64
    concurrency:
      group: desktop-distribution-${{ github.sha }}-${{ matrix.rid }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - name: Find a tested payload for this source and RID
        id: distribution
        uses: actions/github-script@v9
        with:
          script: |
            const findDistribution = require('./.github/scripts/find-distribution.cjs');
            await findDistribution({ github, context, core, rid: '${{ matrix.rid }}' });
      - name: Download the existing tested payload
        if: steps.distribution.outputs.reuse == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.distribution.outputs.artifact-name }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.distribution.outputs.run-id }}
      - name: Use the installed SDK when global.json accepts it
        if: steps.distribution.outputs.reuse != 'true'
        id: sdk
        shell: pwsh
        run: ./.github/scripts/Test-InstalledSdk.ps1
      - uses: actions/setup-dotnet@v5
        if: steps.distribution.outputs.reuse != 'true' && steps.sdk.outputs.available != 'true'
        with:
          global-json-file: global.json
      - uses: actions/cache/restore@v6
        if: steps.distribution.outputs.reuse != 'true'
        id: nuget
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/packages.lock.json', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Identify the native runtime cache
        if: matrix.native-path && steps.distribution.outputs.reuse != 'true'
        id: native
        shell: pwsh
        env:
          RECIPE: ${{ hashFiles('vendor/MonoGame.Native.DX12/**', 'vendor/MonoGame.Native.Vulkan/**', 'vendor/MonoGame.Native.TextInput/**', 'tools/Build-NativeDirect3D12.ps1', 'tools/Test-NativeDirect3D12.ps1', 'tools/Build-NativeVulkan.ps1', '.config/dotnet-tools.json', 'global.json') }}
        run: |
          if (!$env:ImageVersion -or !$env:RECIPE) { throw 'The runner image and native recipe are required for caching.' }
          "key=${{ matrix.os }}-native-v1-$env:ImageVersion-$env:RECIPE" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      # Cache only prepared libraries, receipts and notices. The build scripts
      # verify every restored receipt and binary against the current recipe.
      - uses: actions/cache/restore@v6
        if: matrix.native-path && steps.distribution.outputs.reuse != 'true'
        id: native-cache
        with:
          path: ${{ matrix.native-path }}
          key: ${{ steps.native.outputs.key }}
      - name: Validate artifact reuse and orchestration contracts
        if: steps.distribution.outputs.reuse != 'true'
        shell: pwsh
        run: |
          node --test .github/scripts/*.test.cjs
          ./tools/linux-testing/tests/Orchestration.Tests.ps1
          ./tools/packaging/tests/Packaging.Tests.ps1
          ./tools/Get-PlatformInventory.ps1 -Check
      - name: Install Linux build and font dependencies
        if: runner.os == 'Linux' && steps.distribution.outputs.reuse != 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-core fonts-noto-cjk build-essential cmake git curl unzip openssl binutils libsdl2-dev
      - name: Compile complete distribution
        if: steps.distribution.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./Build.ps1 -RuntimeIdentifier ${{ matrix.rid }}
      - name: Build portable graph and run selected tests
        if: steps.distribution.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./Build.ps1 -Scope Portable -RuntimeIdentifier ${{ matrix.rid }} -Test
      # PRs consume the main cache without uploading another large copy. Only
      # trusted main builds populate it; immutable tested payloads remain separate.
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.distribution.outputs.reuse != 'true' && steps.nuget.outputs.cache-hit != 'true'
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.native-path && steps.distribution.outputs.reuse != 'true' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ matrix.native-path }}
          key: ${{ steps.native.outputs.key }}
      - name: Validated package receipt ${{ matrix.rid }}
        if: steps.distribution.outputs.reuse != 'true'
        shell: pwsh
        env:
          RECIPE: ${{ steps.distribution.outputs.recipe }}
        run: |
          $archives = @(Get-ChildItem artifacts/Memoria-FF8-${{ matrix.rid }}.*)
          if ($archives.Count -ne 1) { throw 'Expected one RID archive.' }
          $archive = $archives[0]
          @{ source = $env:GITHUB_SHA; rid = '${{ matrix.rid }}'; recipe = $env:RECIPE; sdk = (dotnet --version); archive = $archive.Name; sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant(); run = $env:GITHUB_RUN_ID } | ConvertTo-Json | Set-Content artifacts/receipt-${{ matrix.rid }}.json -Encoding utf8NoBOM
      # Re-upload reused payloads into this run: publication collects a complete
      # RID set without an overwritten matrix-job output or a cross-run race.
      - uses: actions/upload-artifact@v7
        if: steps.distribution.outputs.reuse != 'true' || steps.distribution.outputs.run-id != github.run_id
        with:
          name: ${{ steps.distribution.outputs.artifact-name }}
          path: |
            artifacts/Memoria-FF8-${{ matrix.rid }}.*
            artifacts/receipt-${{ matrix.rid }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Publish nightly or tagged release
    needs: package
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Use the installed SDK when global.json accepts it
        id: sdk
        shell: pwsh
        run: ./.github/scripts/Test-InstalledSdk.ps1
      - uses: actions/setup-dotnet@v5
        if: steps.sdk.outputs.available != 'true'
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: Memoria-FF8-*
          merge-multiple: true
          path: artifacts
      - name: Publish complete platform set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-Distributions.ps1 -Directory artifacts -Source $env:GITHUB_SHA -Reference $env:GITHUB_REF_NAME
