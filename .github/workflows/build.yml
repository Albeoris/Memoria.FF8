name: Windows distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  package:
    outputs:
      artifact-run-id: ${{ steps.distribution.outputs.run-id }}
    concurrency:
      group: windows-distribution-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
      - name: Find an existing tested distribution for this commit
        id: distribution
        uses: actions/github-script@v9
        with:
          script: |
            const findDistribution = require('./.github/scripts/find-distribution.cjs');
            await findDistribution({ github, context, core });
      - name: Download the existing distribution
        if: steps.distribution.outputs.reuse == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Memoria-FF8-win-x64
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.distribution.outputs.run-id }}
      - name: Cache NuGet packages
        if: steps.distribution.outputs.reuse != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build and test with the installed .NET 10 SDK
        if: steps.distribution.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./tools/Test-Shaders.ps1 -Compile
          ./Build.ps1
          ./Build.ps1 -Scope Portable -RuntimeIdentifier win-x64 -Test
      - uses: actions/upload-artifact@v7
        if: steps.distribution.outputs.reuse != 'true'
        with:
          name: Memoria-FF8-win-x64
          path: artifacts/Memoria-FF8-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/Set-DistributionVersion.ps1 -ArchivePath artifacts/Memoria-FF8-win-x64.zip -Version "$env:GITHUB_REF_NAME" -BuildId "$env:GITHUB_SHA"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the versioned release.' }
          }
          gh release upload "$env:GITHUB_REF_NAME" "artifacts/Memoria-FF8-win-x64.zip#$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the versioned distribution.' }

  nightly:
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    concurrency:
      group: windows-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Memoria-FF8-win-x64
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.package.outputs.artifact-run-id }}
      - name: Update nightly release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the current main commit.' }
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host 'Skipping nightly: this build is not the current main commit.'
            return
          }
          gh release view nightly --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Nightly' --notes 'Latest successful build from main.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the nightly release.' }
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/nightly" -f "sha=$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Could not advance the nightly source tag.' }
          gh release upload nightly "artifacts/Memoria-FF8-win-x64.zip#$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the nightly distribution.' }
          $updatedAt = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss 'UTC'", [Globalization.CultureInfo]::InvariantCulture)
          gh release edit nightly --repo "$env:GITHUB_REPOSITORY" --title "Nightly - $updatedAt"
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the nightly release title.' }
